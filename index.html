const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const WD_FULL = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'];
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

const SUBJ = [
  ['Математический анализ', 'Петров А. В.', 0, 'Матан'], ['Программирование', 'Смирнова Е. И.', 1, 'Прогр.'], ['История России', 'Козлов Д. С.', 2, 'Ист.'],

const SECOND_SUBJ = [
  ['Прикладная статистика', 'Иванова К. Н.', 0, 'Стат.'], ['Интерфейсы', 'Быков А. О.', 1, 'UX'],

const STAFF_EVENTS = [
  ['Приём студентов', 'Учебный офис', 1, 'Приём'], ['Проверка заявок', 'Учебный офис', 2, 'Заявки'],

function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function eventsFor(d) {
  const k = dkey(d);

  evCache.set(k, list);
  return list;
}
// Свои занятия (долгое нажатие в календаре, «Пойду» на доске мероприятий): {дата: [{id, s, e, t, ty, room, who}]}, только в этом браузере

function freeAt(d, dur = 90, from = 540) {

function lanes(list) {

const DOW = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const DOWF = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const now = () => new Date();
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtDate = d => `${d.getDate()} ${MON[d.getMonth()]}`;
const plural = (n, a, b, c) => { n = Math.abs(n)%100; const n1 = n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; };
const daysTo = iso => Math.round((dayStart(new Date(iso)) - dayStart(now()))/864e5);
const relDays = n => n===0 ? "сегодня" : n===1 ? "завтра" : n<0 ? "прошёл" : `через ${n} ${plural(n,"день","дня","дней")}`;
const durTxt = m => { const h = Math.floor(m/60), mm = m%60; return h ? `${h} ч ${String(mm).padStart(2,"0")} мин` : `${mm} мин`; };

function weekInfo(){
  const t = dayStart(now());
  const wd = t.getDay();
  const monday = addDays(t, wd===0 ? -6 : 1-wd);
  const y = t.getMonth() >= 7 ? t.getFullYear() : t.getFullYear()-1;
  const sep1 = new Date(y, 8, 1);
  const sw = sep1.getDay();
  const acadMon = addDays(sep1, sw===0 ? 1 : 1-sw);
  let no = Math.floor((monday - acadMon)/(7*864e5)) + 1;
  if(no < 1 || no > 22) no = 11;
  return { monday, no, odd: no%2===1, todayWd: wd };
}

  (c.todo||[]).forEach(t => { const late = new Date(t.d) < t0;
    out.push({ic: late?"alert":"clock", t: late ? `Срок «${t.t}» прошёл — договоритесь с преподавателем о сдаче, иначе потеряете до ${t.pts} баллов.`
      : `Сдайте ${t.t} до ${fmtD(t.d)}${t.where?`, ${t.where}`:""} — это до +${t.pts} баллов.`}); });
  c.comps.filter(([n,g,m]) => g!=null && g/m < .7).forEach(([n,g,m]) => out.push({ic:"alert",
    t: n==="Посещение" ? `Пропущено ${m-g} из ${m} занятий — посещение даёт баллы, не пропускайте оставшиеся.`
      : `«${n}»: ${g} из ${m} (${Math.round(g/m*100)} %). Спросите преподавателя о доработке — это самый быстрый резерв баллов.`}));
  const att = c.comps.find(x=>x[0]==="Посещение");
  if(att && att[1]!=null && att[1] < att[2] && att[1]/att[2] >= .7) out.push({ic:"user", t:`Посещение ${att[1]} из ${att[2]}: каждое следующее занятие — это ещё балл к итогу.`});
  const next = ticks.find(([v]) => v > sum);
  if(!next) out.push({ic:"check", t: exam ? "Баллов уже хватает на «отлично» — держите темп до конца семестра." : "Зачёт уже набран — осталось не пропускать до зачётной недели."});
  else if(fin){
    const need = next[0] - sum, when = c.finDate ? ` (${fmtD(c.finDate)})` : "";
    if(need <= fin[2]){
      out.push({ic:"flag", t:`Для ${next[1]} на «${fin[0]}»${when} нужно ${need} из ${fin[2]}.`});
      const up = ticks.find(([v]) => v > next[0]);
      if(up && up[0]-sum <= fin[2]) out.push({ic:"grades", t:`До ${up[1]} — ${up[0]-sum} из ${fin[2]}: реально, если подготовиться заранее.`});
    } else out.push({ic:"alert", t:`Даже максимум за «${fin[0]}» не даст ${next[1]}: не хватит ${need - fin[2]} баллов. Добирайте текущими работами.`});
  } else out.push({ic:"flag", t:`До ${next[1]} не хватает ${next[0]-sum} баллов — спросите о дополнительных заданиях.`});
  return out.slice(0, 4);
}

function ratingRing(){
  const term = Math.max(...Object.keys(RECORD).map(Number)), all = RECORD[term];
  const avg = Math.round(all.reduce((total,r)=>total+r[2],0)/all.length), C = 2*Math.PI*52;
  const cnt = k => all.filter(([,c,b])=>markOf(b,c)[0]===k).length;
  const parts = [["отлично","m5"],["хорошо","m4"],["удовл.","m3"],["зачтено","m5"]].map(([k,m])=>[k,m,cnt(k)]).filter(x=>x[2]);
  return `<section class="card gr-ring" aria-label="Средний балл ${avg} из 100">
    <div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--h3)"/><stop offset="1" stop-color="var(--h1)"/></linearGradient></defs>
      <circle cx="66" cy="66" r="52" class="rt"/><circle cx="66" cy="66" r="52" class="ra" style="--c:${C.toFixed(1)};--o:${(C*(1-avg/100)).toFixed(1)}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-avg/100)).toFixed(1)}"/></svg>
      <div class="ring-c"><b>${avg}</b><span>из 100</span></div></div>
    <div class="ring-side"><div><small>Средний балл за ${term} семестр</small><b>${markOf(avg,"Экзамен")[0]}</b></div>
      <div class="ring-marks">${parts.map(([k,m,n])=>`<span><i class="mark-cell ${m}">${n}</i>${k}</span>`).join("")}</div></div>
  </section>`;
}
function attendance(){
  const ATT = CURRENT.map(c=>c.comps.find(x=>x[0]==="Посещение")).filter(Boolean);
  const got = ATT.reduce((n,x)=>n+x[1],0), all = ATT.reduce((n,x)=>n+x[2],0), missed = all - got;
  const start = new Date(2026,7,31), end = new Date(2026,11,27), t0 = now(); t0.setHours(0,0,0,0);
  const HOL = ["2026-11-04"], days = [];
  for(let d = new Date(start); d < end; d.setDate(d.getDate()+1)){ const wd = d.getDay(); if(wd===0) continue;
    const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    days.push({d:new Date(d), iso, n: d < new Date(2026,8,1) || HOL.includes(iso) ? 0 : (SCHEDULE[wd]||[]).length, past: d <= t0, miss:0}); }
  // пропуски раскладываются по прошедшим дням детерминированно, чтобы сумма совпала с баллами за посещение
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const past = days.filter(x=>x.past && x.n);
  for(let k=0; k<missed && past.length; k++){
    const i = Math.floor(rnd()*past.length), x = past[i];
    if(++x.miss === x.n) past.splice(i,1);
  }
  const weeks = Math.ceil(days.length/6), MN = ["сен","окт","ноя","дек"];
  const cells = days.map(x=>{ const lvl = !x.n ? "e" : !x.past ? "f" : x.miss===x.n ? "m" : x.miss ? "p" : "a" + Math.min(4, x.n);
    const lab = `${x.d.getDate()} ${MONS[x.d.getMonth()]}: ${!x.n?"занятий нет":!x.past?`${x.n} ${plural(x.n,"пара","пары","пар")} впереди`:`${x.n-x.miss} из ${x.n} ${plural(x.n,"пары","пар","пар")}`}`;
    return `<i class="${lvl}" title="${lab}"></i>`; }).join("");
  const monthCols = [0,1,2,3].map(m=>{ const first = days.findIndex(x=>x.d.getMonth()===8+m && x.d.getDate()>=1); return `<span style="grid-column:${Math.floor(first/6)+1}">${MN[m]}</span>`; }).join("");
  return `<section class="card gr-att"><div class="card-h"><h2>Посещаемость</h2><b class="gr-pct">${Math.round(got/all*100)} %</b></div>
    <div class="hm-wrap" style="--w:${weeks}"><div class="hm-m" style="--w:${weeks}">${monthCols}</div>
      <div class="hm" style="--w:${weeks}" role="img" aria-label="Посещаемость по дням: пропущено ${missed} из ${all} занятий">${cells}</div></div>
    <div class="hm-leg"><span>Пропущено ${missed} из ${all} занятий</span><span class="hm-key"><i class="m"></i>пропуск<i class="p"></i>частично<i class="a3"></i>все пары</span></div>
  </section>`;
}

// FLIP: окно стартует с размеров и места кнопки и пружинит в центр; закрытие — обратно в кнопку
function morph(gm, from, back){
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches || document.documentElement.classList.contains("calm");
  const wrap = gm.parentElement;
  if(!from || !from.isConnected || still){
    const a = gm.animate([{opacity:0, transform:"scale(.96)"},{opacity:1, transform:"none"}], {duration: still ? 120 : 220, easing:"ease-out", direction: back?"reverse":"normal", fill:"both"});
    wrap.animate([{opacity:0},{opacity:1}], {duration:200, direction: back?"reverse":"normal", fill:"both"});
    return a.finished;
  }
  const f = from.getBoundingClientRect(), t = gm.getBoundingClientRect();
  const dx = (f.left + f.width/2) - (t.left + t.width/2), dy = (f.top + f.height/2) - (t.top + t.height/2);
  const start = {transform:`translate(${dx}px,${dy}px) scale(${f.width/t.width},${f.height/t.height})`, borderRadius:"999px"}, end = {transform:"none", borderRadius:"32px"};
  from.style.visibility = "hidden";
  const o = {duration: back ? 380 : 620, easing: back ? "cubic-bezier(.5,0,.75,0)" : "cubic-bezier(.2,1.15,.35,1)", fill:"both"};
  const a = gm.animate(back ? [end, start] : [start, end], o);
  gm.querySelector(".gm-in").animate(back ? [{opacity:1},{opacity:0, offset:.4},{opacity:0}] : [{opacity:0},{opacity:0, offset:.35},{opacity:1}], o);
  wrap.animate([{backgroundColor:"transparent", backdropFilter:"blur(0)"},{}], {duration: o.duration, direction: back?"reverse":"normal", fill:"both"});
  if(!back){ a.finished.then(()=>{ from.style.visibility = ""; }); setTimeout(()=>{ from.style.visibility = ""; }, o.duration + 100); }
  return a.finished.then(()=>{ if(back) from.style.visibility = ""; });
}

// в списке: сегодня — время, раньше — дата
const shortW = w => { const [day, time] = w.split(", "), d = now(); return day === `${d.getDate()} ${MONS[d.getMonth()]}` ? time : day; };
const ICO = {

const nrm = v => String(v).toLowerCase().replace(/ё/g,"е");

      <span class="avatar ${p.k}">${p.ini}</span>

      <span class="ms-go">${CHATS.some(c=>c.id===p.id)?"Открыть":"Написать"}</span></button>`;
// раскладка: «rbv» → «ким»; слово от 4 букв ищется по основе («сеть» находит «сети», «петрову» — «Петров»)
const EN_KB = "qwertyuiop[]asdfghjkl;'zxcvbnm,.`", RU_KB = "йцукенгшщзхъфывапролджэячсмитьбюё";
const toRu = v => [...v].map(c => { const i = EN_KB.indexOf(c); return i < 0 ? c : RU_KB[i]; }).join("");
const stem = w => w.length >= 4 ? w.slice(0, w.length - (w.length > 5 ? 2 : 1)) : w;
function matcher(raw){
  const q = nrm(raw).trim();
  if(!q) return () => true;
  const variants = [q, toRu(q)].filter((v,i,a) => a.indexOf(v) === i).map(v => v.split(/\s+/).map(stem));
  return x => { const hay = nrm([x.n, x.role, ...(x.info||[]).map(r=>r[1])].join(" ")); return variants.some(ws => ws.every(w => hay.includes(w))); };
}
function msItems(){
  const q = nrm(S.msQ).trim(), hit = matcher(S.msQ);
  if(S.msKind !== "chats"){
    const ppl = PEOPLE.filter(p => p.k===S.msKind && hit(p));
    return ppl.map(personRow).join("") || '<p class="ms-empty">Никого не нашли. Попробуйте фамилию или группу.</p>';
  }
  const chats = CHATS.filter(hit), ppl = q ? PEOPLE.filter(p => !CHATS.some(c=>c.id===p.id) && hit(p)) : [];
  return chats.map(chatRow).join("") + (ppl.length ? `<p class="ms-sec">Люди в вузе</p>${ppl.map(personRow).join("")}` : "")
    || '<p class="ms-empty">Ничего не нашли. Поищите среди преподавателей и студентов.</p>';
}

function demoReply(c, msg){
  const text = (msg.t||"").toLowerCase().replace(/ё/g,"е").trim();
  const peer = c.person==="student";
  if(msg.file) return peer ? "Вижу вложение. Что в нём нужно посмотреть?" : "Вложение получил учебный чат. Уточните, что нужно проверить.";
  if(/ссылк|документ|материал|файл|конспект/.test(text))
    return peer ? "Какой именно документ нужен? Напиши название, чтобы я понял, какую ссылку искать." : "Подскажите название документа или курса, чтобы уточнить, где находится нужная ссылка.";
  if(/справк|заявлен/.test(text))
    return c.id==="dean" ? "Если заявка уже подана, пришлите её номер из раздела «Документы». Если нет, уточните, какая справка нужна." : "Какую справку или заявление вы имеете в виду?";
  if(/пересдач|дедлайн|сда(ть|ча)|оценк|балл/.test(text))
    return peer ? "По какому предмету? Могу подсказать, где посмотреть условия." : "Уточните дисциплину и задание, чтобы разобраться с этим вопросом.";
  if(/консультац|встреч|расписан|аудитори/.test(text))
    return peer ? "На какой день и по какому предмету уточняешь?" : "Уточните день и дисциплину. Если ищете часы консультаций, откройте информацию о контакте.";
  if(/^спасибо[!.\s]*$/.test(text)) return "Пожалуйста!";
  if(/^(привет|здравствуйте|добрый день)[!.\s]*$/.test(text)) return peer ? "Привет! Чем помочь?" : "Здравствуйте! Чем могу помочь?";
  return peer ? "Можешь уточнить, что именно тебе нужно?" : "Уточните, пожалуйста, детали вопроса.";
}
function sendChat(msg){
  const state = S, id = S.chatId, c = CHATS.find(x=>x.id===id);
  if(id==="dean") S.chat.push(msg); else (S.chats[id] = S.chats[id] || []).push(msg);
  save(); render();
  if(!c.reply || S.typing) return;
  setTimeout(()=>{ if(S!==state) return; S.typing = id; if(S.view==="inbox") render(); }, 600);
  setTimeout(()=>{ if(S!==state) return; S.typing = null; const r = {me:false, t:demoReply(c,msg), w:stamp(), who:c.role.split(" · ")[0]};
    if(id==="dean") S.chat.push(r); else (S.chats[id] = S.chats[id] || []).push(r);
    save(); if(document.getElementById("app").hidden) return;
    if(S.view==="inbox") render(); if(S.view!=="inbox" || S.chatId!==id) toast(`${c.n}: новое сообщение`); }, 2400);
}

/* окна профиля листаются горизонтально (scroll-snap); переключатель и лента синхронны */
function pfMount(){
  const tr = document.getElementById("pfTrack"); if(!tr) return;
  tr.scrollLeft = S.infoTab * tr.clientWidth;
  let t; tr.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(() => {
    if(getComputedStyle(tr).overflowX === "visible") return;          // на широком экране окна стоят рядом
    const i = Math.round(tr.scrollLeft / tr.clientWidth); if(i === S.infoTab) return;
    S.infoTab = i; document.querySelectorAll(".pf-tabs button").forEach((b,k)=>{ b.setAttribute("aria-pressed", k===i); b.setAttribute("aria-selected", k===i); });
  }, 90); }, {passive:true});
}

function closeSheet(instant){
  const root = document.getElementById("sheetRoot"), gm = root.querySelector(".gm");
  if(!gm || instant || gm.dataset.closing){ root.innerHTML = ""; return; }
  gm.dataset.closing = 1;
  const from = document.querySelector(`[data-action="picker"][data-k="${gm.dataset.k}"]`);
  // запасной таймер: анимации стоят, пока вкладка не отрисовывается (фон, headless)
  const done = () => { if(root.contains(gm)) root.innerHTML = ""; if(from) from.style.visibility = ""; };
  morph(gm, from, true).then(done); setTimeout(done, 520);
}

/* псевдо-QR: узор для демонстрации, не настоящий код */
function drawQR(canvas, seed){
  const n = 25, px = canvas.width / n, ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  let s = 0; for(const ch of seed) s = (s*31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  ctx.fillStyle = "#111";
  const finder = (x,y) => { ctx.fillRect(x*px,y*px,7*px,7*px); ctx.fillStyle="#fff"; ctx.fillRect((x+1)*px,(y+1)*px,5*px,5*px); ctx.fillStyle="#111"; ctx.fillRect((x+2)*px,(y+2)*px,3*px,3*px); };
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const inF = (x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
    if(!inF && rnd() > .52) ctx.fillRect(x*px,y*px,px,px);
  }
  finder(0,0); finder(n-7,0); finder(0,n-7);
}

function submitOrder(f){
  if(isStaff()) return;
  const c = CATALOG.find(x=>x.id===f.dataset.id);
  if(c.app && !f.elements.why.value.trim()){ const er = f.querySelector(".err"); er.textContent = "Опишите причину — без неё методист не сможет рассмотреть заявление."; er.hidden = false; f.elements.why.focus(); return; }
  const fmt = f.querySelector('input[name="fmt"]:checked'), isE = !!fmt && fmt.value === "e", to = f.elements.to, d = now();
  const r = { id:`З-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,"0")}-${String(Math.floor(600+Math.random()*399)).padStart(4,"0")}`,
    t:c.t, sub: c.app ? "Заявление · онлайн" : `${to?to.value:""} · ${isE?"электронная":"бумажная"}`,
    step:0, date:d.toISOString().slice(0,10), doc:isE, purpose: to?to.value:"", info: c.app ? "Передано методисту" : isE ? "Формируется и подписывается" : `Будет готова: ${c.sla.toLowerCase()}` };
  S.reqs.unshift(r); save(); closeSheet(true); go("requests");
  toast(c.app ? "Заявление подано" : "Справка заказана");
  if(isE){
    const login = account;
    const progress = (step, info) => {
      r.step = step; r.info = info;
      const active = account===login, reqs = active ? S.reqs : LS.get("reqs", [], login);
      const current = reqs.find(item=>item.id===r.id);
      if(!current) return;
      Object.assign(current, {step, info});
      LS.set("reqs", reqs, login);
      if(active && S.view==="requests" && !document.getElementById("app").hidden){ render(); if(step===2) toast("Справка готова"); }
    };
    setTimeout(()=>progress(1,"Подписывается электронной подписью"), 1400);
    setTimeout(()=>progress(2,"Готова. Можно открыть и отправить"), 3400);
  }
}

  const code = id.replace(/\D/g,"").slice(-6).replace(/(\d{3})(\d{3})/,"$1-$2");
  openSheet("Справка об обучении", `<div class="doc">
      <div class="dh">Министерство науки и высшего образования<br>Университет · ${STUDENT.inst}</div>
      <h3>СПРАВКА</h3>
      <p><b>${STUDENT.fio}</b> обучается на ${STUDENT.course} курсе по направлению подготовки ${STUDENT.program}. Форма и основание обучения: ${STUDENT.form}.</p>
      <p>Срок окончания обучения: 31 августа 2028 г.<br>Справка выдана для предоставления: ${esc(r.purpose||"по месту требования")}.</p>
      <p style="font-size:12px;color:#666">№ ${r.id} от ${fmtDate(new Date(r.date))} ${new Date(r.date).getFullYear()} г.</p>
      <div class="sign"><canvas id="docqr" width="100" height="100" style="width:72px;height:72px"></canvas><div>ДОКУМЕНТ ПОДПИСАН<br>ЭЛЕКТРОННОЙ ПОДПИСЬЮ<br><span style="color:#333">Код проверки: <b class="mono">${code}</b></span></div></div>
    </div>
    <p class="muted small" style="margin-top:12px">Это демонстрация: QR-узор и подпись условные. В рабочей версии получатель сканирует QR и видит оригинал на сайте вуза.</p>
    <button class="btn block" style="margin-top:12px" data-action="copylink" data-id="${r.id}">Скопировать код проверки</button>`,
    root => drawQR(root.querySelector("#docqr"), r.id));
}

/* ===== события ===== */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g){ if(g.dataset.tab) S.inboxTab = g.dataset.tab; if(g.dataset.tab==="chat"){ S.chatId = "dean"; S.chatOpen = true; } if(g.closest("#sheetRoot")) closeSheet(true); return; }
  const a = e.target.closest("[data-action]");
  if(!a) return;
  const act = a.dataset.action;
  if(act==="closesheet"){ if(e.target===a || a.tagName==="BUTTON") closeSheet(); return; }
  if(act==="pref") return;
  switch(act){
    case "day": S.day = +a.dataset.w; render(); break;
    case "guide": {
      e.preventDefault();
      const panel = document.getElementById(a.getAttribute("aria-controls"));
      panel.hidden = !panel.hidden;
      a.setAttribute("aria-expanded", String(!panel.hidden));
      break;
    }
    case "gtab": S.gradeTab = a.dataset.t; render(); break;
    case "sem": S.sem = +a.dataset.n; render(); break;
    case "subj": S.openSubj[a.dataset.i] = !S.openSubj[a.dataset.i]; render(); break;
    case "nf": S.noteFilter = a.dataset.k; render(); break;
    case "itab": S.inboxTab = a.dataset.t; render(); break;
    case "chat": S.chatId = a.dataset.id; S.chatOpen = true; if(!S.chatRead.includes(S.chatId)) S.chatRead.push(S.chatId); save(); render();
      if(innerWidth >= 760) document.getElementById("chatInput")?.focus({preventScroll:true}); break;
    case "chatback": S.chatOpen = false; render(); break;
    case "mskind": S.msKind = a.dataset.k; render(); if(matchMedia("(hover: hover)").matches) document.getElementById("msQ")?.focus({preventScroll:true}); break;   // на телефоне клавиатура сама не выезжает
    case "person": { const p = PEOPLE.find(x=>x.id===a.dataset.id);
      if(!CHATS.some(c=>c.id===p.id)){ CHATS.unshift(personChat(p)); S.people.push(p.id); }
      S.chatId = p.id; S.chatOpen = true; S.msQ = ""; S.msKind = "chats"; if(!S.chatRead.includes(p.id)) S.chatRead.push(p.id); save(); render();
      if(innerWidth >= 760) document.getElementById("chatInput")?.focus({preventScroll:true}); break; }
    case "evf": S.evFilter = a.dataset.k; render(); break;
    case "evgo": evToggle(a.dataset.id); if(a.dataset.sheet) closeSheet(true); if(S.view==="inbox") render(); break;
    case "evmore": evMore(a.dataset.id); break;
    case "bgpick": window.lkUI.set("bg", a.dataset.v); render(); break;
    case "chatinfo": { const c = CHATS.find(x=>x.id===S.chatId);
      openSheet(c.n, `<div class="row" style="margin-bottom:14px"><span class="avatar">${c.ini}</span><span class="grow muted small">${esc(c.role)}</span></div>
        <dl class="kv" style="margin:0">${c.info.map(([k,v])=>`<dt>${k}</dt><dd style="user-select:all;overflow-wrap:anywhere">${esc(v)}</dd>`).join("")}</dl>`); break; }
    case "docs": go("requests"); if(a.dataset.k) openPicker(a.dataset.k); break;
    case "pftab": { S.infoTab = +a.dataset.i; document.querySelectorAll(".pf-tabs button").forEach((b,k)=>{ b.setAttribute("aria-pressed", k===S.infoTab); b.setAttribute("aria-selected", k===S.infoTab); });
      const tr = document.getElementById("pfTrack"); tr.scrollTo({left: S.infoTab*tr.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); break; }
    case "pfeye": S.shown[a.dataset.k] = !S.shown[a.dataset.k]; render(); break;
    case "pfcopy": { const k = a.dataset.k, p = profileInfo().find(p=>k.startsWith(p.id)), row = p.rows[+k.slice(p.id.length)];
      const done = () => toast(`${row[0]}: скопировано`);
      try{ navigator.clipboard.writeText(row[1]).then(done, done); }catch(err){ done(); } break; }
    case "readall": S.read = NOTES.map(n=>n.id); save(); render(); toast("Все уведомления прочитаны"); break;
    case "note": { const n = NOTES.find(x=>x.id===a.dataset.id); if(!S.read.includes(n.id)) S.read.push(n.id); save(); if(n.go) go(n.go); else render(); break; }
    case "staff-step": {
      const r = S.reqs.find(x=>x.id===a.dataset.id);
      if(isStaff() && r?.step<2){ r.step++; save(); render(); }
      break;
    }
    case "order": showOrder(a.dataset.id); break;
    case "picker": openPicker(a.dataset.k); break;
    case "gmopen": gmToggle(a.dataset.id); break;
    case "doc": showDoc(a.dataset.id); break;
    case "card": showCard(); break;
    case "copylink": { const code = a.dataset.id.replace(/\D/g,"").slice(-6).replace(/(\d{3})(\d{3})/,"$1-$2");
      const done = () => toast(`Код ${code} скопирован`);
      try{ navigator.clipboard.writeText(code).then(done, ()=>toast(`Код проверки: ${code}`)); }catch(err){ toast(`Код проверки: ${code}`); } break; }
    case "topic": { const inp = document.getElementById("chatInput"); inp.value = `${a.dataset.t}: `; inp.focus(); break; }
    case "kill": S.devices = S.devices.filter(d=>d.id!==a.dataset.id); save(); render(); toast("Сеанс завершён"); break;
    case "logout": window.lkLogout(); break;
    case "theme": { window.lkUI.set("theme", a.dataset.v); const sw = a.parentElement; sw.style.setProperty("--i", THEMES.findIndex(t=>t[0]===a.dataset.v));
      sw.querySelectorAll("button").forEach(b=>b.setAttribute("aria-checked", b===a)); break; }
    case "clockst": window.lkUI.set("clock", a.dataset.v); a.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-checked", b===a)); toast("Стиль часов: " + a.textContent.trim()); break;
    case "access": go("access"); break;
    case "dkmove": { const cfg = window.lkUI.get().dock, i = cfg.findIndex(c=>c.id===a.dataset.id), j = i + +a.dataset.d;
      if(j<0 || j>=cfg.length) break; [cfg[i], cfg[j]] = [cfg[j], cfg[i]]; window.lkUI.set("dock", cfg); render();
      document.querySelector(`.dk-row[data-id="${a.dataset.id}"] [data-d="${a.dataset.d}"]:not(:disabled)`)?.focus(); break; }
    case "dkicon": { const cfg = window.lkUI.get().dock; cfg.find(c=>c.id===a.dataset.id).ic = +a.dataset.n; window.lkUI.set("dock", cfg); render(); break; }
    case "dkreset": window.lkUI.set("dock", null); render(); toast("Док вернулся к исходному виду"); break;
  }
}, true);
document.addEventListener("change", e => {
  const t = e.target;
  if(t.id === "bgFile" && t.files[0]){
    window.lkUI.setPhoto(t.files[0]).then(kept => { if(S.view==="settings") render(); toast(kept ? "Фон обновлён" : "Фото большое: фон сохранится только до перезагрузки"); }, () => toast("Не получилось открыть изображение"));
    return;
  }
  if(t.id === "chatFile" && t.files[0]){ const f = t.files[0]; sendChat({me:true, t:"", file:`${f.name} · ${Math.max(1, Math.round(f.size/1024))} КБ`, w:stamp()}); return; }
  if(t.dataset && t.dataset.action==="pref"){
    const k = t.dataset.k;
    if(k==="tfa"){ S.tfa = t.checked; toast(t.checked ? "Код подтверждения включён" : "Код подтверждения выключен"); }
    else { S.prefs[k] = t.checked; }
    save();
  }
  if(t.dataset && t.dataset.action==="uipref") window.lkUI.set(t.dataset.k, t.checked);
  if(t.dataset && t.dataset.action==="dkon"){ const cfg = window.lkUI.get().dock; cfg.find(c=>c.id===t.dataset.k).on = t.checked; window.lkUI.set("dock", cfg); render(); }
});
document.addEventListener("input", e => {
  if(e.target.id === "gmQ"){
    const q = e.target.value.trim().toLowerCase(), its = [...document.querySelectorAll("#gmList .gm-it")];
    let n = 0; its.forEach(it => { const hit = !q || q.split(/\s+/).every(w => it.dataset.k.includes(w)); it.hidden = !hit; if(hit) n++; });
    document.querySelector("#gmList .gm-empty").hidden = n > 0;
    if(n === 1 && q.length > 2) gmToggle(its.find(it=>!it.hidden).dataset.id, true);
    return;
  }
  if(e.target.id === "msQ"){ S.msQ = e.target.value; document.getElementById("msItems").innerHTML = msItems(); return; }
  if(e.target.id !== "glassRng") return;
  const v = +e.target.value; e.target.style.setProperty("--v", v + "%");
  document.getElementById("glassVal").textContent = v + "%";
  window.lkUI.set("glass", v);
});
document.addEventListener("submit", e => {
  if(e.target.classList.contains("gm-form")){ e.preventDefault(); submitOrder(e.target); return; }
  if(e.target.id !== "composer") return;
  e.preventDefault();
  const inp = document.getElementById("chatInput"), v = inp.value.trim();
  if(!v) return;
  sendChat({me:true, t:v, w:stamp()});
  document.getElementById("chatInput")?.focus({preventScroll:true});
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape") closeSheet();
  if((e.key==="Enter" || e.key===" ") && e.target.classList?.contains("bg-up")){ e.preventDefault(); e.target.querySelector("input").click(); }
});
})();
</script>

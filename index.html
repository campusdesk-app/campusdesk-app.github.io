<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F8FD">
  <title>Личный кабинет</title>
  <!-- тема и стиль часов до первой отрисовки, чтобы не мигала светлая тема; дальше всё делает app.js -->
  <script>try{var u=JSON.parse(localStorage.getItem('lk:ui'))||{},t=u.theme||'light',r=document.documentElement;r.dataset.scheme=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;r.dataset.clock=u.clock||'classic';r.dataset.bg=u.bg&&u.bg!=='photo'?u.bg:'spheres'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@200;300;400;500;600;700&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
/* Разделы из шаблона «Зачётка», изолированы под .zk. Токены переопределены в app.css */
.zk{--h:162;
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#F4F6F2; --ink:#15201C; --muted:#5D6A64; --line:#DAE1DB;
  --accent:hsl(var(--h) 78% 22%); --accent-ink:#FFFFFF; --accent-soft:hsl(var(--h) 40% 91%);
  --mark:#F3D35A; --mark-ink:#3A3000;
  --alert:#C8452A; --alert-soft:#FBE4DC; --warn:#9A6514; --warn-soft:#FBEFD6; --ok:#25804F; --ok-soft:#DDF1E4;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 6px 24px rgba(20,32,28,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;}
.zk *{box-sizing:border-box}
.zk,.zk{height:100%}
.zk{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.zk button,.zk input,.zk select,.zk textarea{font:inherit;color:inherit}
.zk button{cursor:pointer;border:0;background:none;padding:0}
.zk :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.zk h1,.zk h2,.zk h3{margin:0;text-wrap:balance;font-weight:600}
.zk p{margin:0}
.zk .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.zk .muted{color:var(--muted)}
.zk .small{font-size:13px}
.zk .eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.zk svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.zk svg.i.s{width:18px;height:18px}
.zk .app{min-height:100%}
.zk .side{display:none}
.zk .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.zk .brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.zk .brand-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px}
.zk .topbar .grow{flex:1}
.zk .iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;background:var(--surface);border:1px solid var(--line)}
.zk .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.zk .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.zk main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 110px;max-width:1140px}
.zk .view{display:grid;gap:16px}
.zk .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-top:6px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.zk .tab{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:6px 0;position:relative}
.zk .tab[aria-current="page"]{color:var(--accent)}
.zk .tab .badge{top:0;right:calc(50% - 22px)}
@media (min-width:960px){.zk .app{display:grid;grid-template-columns:256px 1fr}
.zk .topbar,.zk .tabbar{display:none}
.zk .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.zk .side .brand{padding:0 10px 18px}
.zk .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;text-align:left;position:relative}
.zk .nav:hover{background:var(--surface-2);color:var(--ink)}
.zk .nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.zk .nav .badge{position:static;margin-left:auto}
.zk .side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2);text-align:left}
.zk main{padding-block:28px 48px;padding-left:36px;padding-right:36px}}
.zk .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.zk .card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.zk .card-h h2{font-size:16px}
.zk .link{color:var(--accent);font-weight:600;font-size:14px}
.zk .page-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;padding-top:4px}
.zk .page-h h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4vw,30px);letter-spacing:-.02em}
.zk .cols{display:grid;gap:16px}
@media (min-width:960px){.zk .cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.zk .stack{display:grid;gap:16px;min-width:0}
.zk .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.zk .chip.accent{background:var(--accent-soft);color:var(--accent)}
.zk .chip.mark{background:var(--mark);color:var(--mark-ink)}
.zk .chip.alert{background:var(--alert-soft);color:var(--alert)}
.zk .chip.warn{background:var(--warn-soft);color:var(--warn)}
.zk .chip.ok{background:var(--ok-soft);color:var(--ok)}
.zk .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.zk .btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.zk .btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.zk .btn.block{width:100%}
.zk .btn:disabled{opacity:.5;cursor:default}
.zk .seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.zk .seg button{flex:1 0 auto;height:34px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.zk .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.zk .row{display:flex;align-items:center;gap:12px;min-width:0}
.zk .row > .grow{flex:1;min-width:0}
.zk .list{display:grid}
.zk .list > *{padding-block:12px;border-top:1px solid var(--line)}
.zk .list > *:first-child{border-top:0;padding-top:0}
.zk .list > *:last-child{padding-bottom:0}
.zk .empty{padding:22px;text-align:center;color:var(--muted)}
.zk .hello h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,5vw,34px);letter-spacing:-.02em;line-height:1.15}
.zk .hello .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.zk .now{background:var(--accent);color:var(--accent-ink);border:0;padding:18px;border-radius:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.zk .now .eyebrow{color:inherit;opacity:.8}
.zk .now h2{font-size:22px;line-height:1.2}
.zk .now .facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;opacity:.92}
.zk .now .facts span{display:inline-flex;gap:6px;align-items:center}
.zk .now .bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);overflow:hidden}
.zk .now .bar i{display:block;height:100%;background:var(--mark);border-radius:3px}
.zk .now .next{display:flex;gap:10px;align-items:center;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 20%,transparent);font-size:14px}
.zk .now .count{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.zk .alertcard{display:flex;gap:12px;align-items:flex-start;background:var(--alert-soft);border:1px solid color-mix(in srgb,var(--alert) 30%,transparent);border-radius:var(--r);padding:14px 16px;color:var(--ink)}
.zk .alertcard svg{color:var(--alert);margin-top:1px}
.zk .alertcard b{color:var(--alert)}
.zk .quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.zk .quick button{display:grid;justify-items:center;gap:6px;padding:14px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500;line-height:1.25;text-align:center}
.zk .quick button span.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.zk .mini-pair{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.zk .mini-pair .t{font-family:var(--f-mono);font-size:13px;line-height:1.3}
.zk .mini-pair.done{opacity:.5}
.zk .mini-pair.live .t{color:var(--accent);font-weight:600}
.zk .dl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.zk .dl .d{width:44px;text-align:center;border-radius:10px;background:var(--surface-2);padding:5px 0;line-height:1.1}
.zk .dl .d b{display:block;font-family:var(--f-display);font-size:17px}
.zk .dl .d small{font-size:11px;color:var(--muted)}
.zk .dl.hot .d{background:var(--mark);color:var(--mark-ink)}
.zk .dl.hot .d small{color:var(--mark-ink)}
.zk .week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.zk .day{display:grid;justify-items:center;gap:2px;padding:10px 0 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.zk .day small{font-size:12px;color:var(--muted);font-weight:500}
.zk .day b{font-family:var(--f-display);font-size:18px;font-weight:500}
.zk .day .dots{display:flex;gap:3px;height:5px}
.zk .day .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.zk .day .dots i.c{background:var(--alert)}
.zk .day.today b{color:var(--accent)}
.zk .day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.zk .day[aria-pressed="true"] small,.zk .day[aria-pressed="true"] b{color:var(--bg)}
.zk .day[aria-pressed="true"] .dots i{background:color-mix(in srgb,var(--bg) 40%,transparent)}
.zk .day[aria-pressed="true"] .dots i.c{background:var(--mark)}
.zk .pair{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);position:relative}
.zk .pair .num{display:grid;align-content:start;gap:2px}
.zk .pair .num b{font-family:var(--f-display);font-size:13px;font-weight:500;color:var(--muted)}
.zk .pair .num span{font-family:var(--f-mono);font-size:13.5px;line-height:1.35}
.zk .pair h3{font-size:16.5px;line-height:1.3}
.zk .pair .facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:14px;color:var(--muted)}
.zk .pair .facts span{display:inline-flex;align-items:center;gap:6px}
.zk .pair .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.zk .pair.changed{border-color:color-mix(in srgb,var(--alert) 45%,var(--line))}
.zk .pair.cancel{background:var(--surface-2)}
.zk .pair.cancel h3{text-decoration:line-through;color:var(--muted)}
.zk .pair.live{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.zk .pair .note{margin-top:10px;font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--alert-soft);color:var(--ink)}
.zk .pair .note b{color:var(--alert)}
.zk s.old{color:var(--muted)}
.zk .gap{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);padding:0 4px}
.zk .gap::before,.zk .gap::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.zk .summary{display:grid;gap:14px}
.zk .summary .head{font-size:18px;font-weight:600;line-height:1.35}
.zk .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.zk .stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.zk .stat{padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.zk .stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.zk .stat small{font-size:12.5px;color:var(--muted)}
.zk .subj{display:grid;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.zk .subj .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.zk .subj h3{font-size:16px;line-height:1.3}
.zk .subj .pts{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;white-space:nowrap}
.zk .subj .pts small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.zk .scale{position:relative;height:28px}
.zk .scale .track{position:absolute;left:0;right:0;top:6px;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.zk .scale .fill{height:100%;border-radius:4px;background:var(--accent)}
.zk .subj.risk .scale .fill{background:var(--alert)}
.zk .scale .tick{position:absolute;top:2px;height:16px;width:2px;background:var(--ink);opacity:.35;border-radius:1px}
.zk .scale .tl{position:absolute;top:17px;font-size:10.5px;color:var(--muted);transform:translateX(-50%);font-family:var(--f-mono)}
.zk .subj .hint{font-size:14px;display:flex;gap:8px;align-items:flex-start}
.zk .subj .hint svg{margin-top:1px}
.zk .subj.risk .hint{color:var(--alert)}
.zk .subj .more{display:none;border-top:1px solid var(--line);padding-top:10px}
.zk .subj.open .more{display:grid;gap:6px}
.zk .comp{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:14px}
.zk .comp .v{font-family:var(--f-mono)}
.zk .record{width:100%;border-collapse:collapse;font-size:14px}
.zk .record th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px 0}
.zk .record td{padding:10px 8px 10px 0;border-top:1px solid var(--line);vertical-align:top}
.zk .record td:last-child,.zk .record th:last-child{text-align:right;padding-right:0}
.zk .mark-cell{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 8px;border-radius:8px;font-weight:700;font-family:var(--f-mono);font-size:13px;background:var(--surface-2)}
.zk .m5{background:var(--ok-soft);color:var(--ok)}
.zk .m4{background:var(--accent-soft);color:var(--accent)}
.zk .m3{background:var(--warn-soft);color:var(--warn)}
.zk .session{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.zk .session .big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent)}
.zk .timeline{display:grid;gap:8px;margin-top:14px}
.zk .timeline .r{display:grid;grid-template-columns:96px 1fr auto;gap:10px;font-size:14px;align-items:center}
.zk .req{display:grid;gap:12px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.zk .req .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.zk .req h3{font-size:16px;line-height:1.3}
.zk .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.zk .steps i{display:block;height:4px;border-radius:2px;background:var(--surface-2)}
.zk .steps i.on{background:var(--accent)}
.zk .steps i.cur{background:linear-gradient(90deg,var(--accent) 50%,var(--surface-2) 50%)}
.zk .steplabels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11.5px;color:var(--muted)}
.zk .steplabels span.on{color:var(--ink);font-weight:600}
.zk .catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.zk .cat{display:grid;gap:6px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;align-content:start}
.zk .cat:hover{border-color:var(--accent)}
.zk .cat h3{font-size:15px;line-height:1.3}
.zk .cat .row{gap:8px;flex-wrap:wrap}
.zk .note-item{display:grid;grid-template-columns:auto 1fr;gap:12px;text-align:left;width:100%}
.zk .note-item .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.zk .note-item.k-schedule .ic{background:var(--alert-soft);color:var(--alert)}
.zk .note-item.k-deadline .ic{background:var(--mark);color:var(--mark-ink)}
.zk .note-item.k-dean .ic{background:var(--accent-soft);color:var(--accent)}
.zk .note-item.k-docs .ic{background:var(--ok-soft);color:var(--ok)}
.zk .note-item h3{font-size:15px;line-height:1.35;font-weight:600}
.zk .note-item.read h3{font-weight:500}
.zk .note-item p{font-size:14px;color:var(--muted);margin-top:2px}
.zk .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;vertical-align:middle}
.zk .chat{display:grid;gap:10px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.zk .msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;background:var(--surface-2)}
.zk .msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.zk .msg.them{border-bottom-left-radius:5px}
.zk .msg small{display:block;font-size:11px;opacity:.7;margin-top:4px}
.zk .composer{display:flex;gap:8px;margin-top:12px}
.zk .composer input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px}
.zk .topics{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.zk .topics button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--surface)}
.zk .idcard{border-radius:20px;padding:18px;background:var(--ink);color:var(--bg);display:grid;gap:14px;position:relative;overflow:hidden}
.zk .idcard::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--accent);opacity:.55}
.zk .idcard > *{position:relative;z-index:1}
.zk .idcard .who{display:flex;gap:14px;align-items:center}
.zk .idcard .ph{width:62px;height:62px;border-radius:16px;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px}
.zk .idcard h2{font-size:18px;line-height:1.25}
.zk .idcard .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;font-size:13.5px}
.zk .idcard .grid small{display:block;opacity:.65;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.zk .kv{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:10px;font-size:14.5px}
.zk .kv dt{color:var(--muted)}
.zk .kv dd{margin:0;font-weight:500}
.zk .toggle{position:relative;width:46px;height:28px;flex:none}
.zk .toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.zk .toggle span{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:background .2s}
.zk .toggle span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.zk .toggle input:checked + span{background:var(--accent)}
.zk .toggle input:checked + span::after{transform:translateX(18px)}
.zk .toggle input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.zk .swatches{display:flex;gap:10px;flex-wrap:wrap}
.zk .swatch{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.zk .swatch i{width:24px;height:24px;border-radius:8px}
.zk .swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.zk .sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.zk .sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;
  padding-block:10px max(20px,env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  animation:up .22s ease-out}

.zk .sheet{border-radius:22px;padding-bottom:22px}
.zk .sheet .grab{display:none}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.zk .field{display:grid;gap:6px}
.zk .field label,.zk .field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.zk .field input,.zk .field select,.zk .field textarea{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;width:100%}
.zk .field textarea{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.zk .form{display:grid;gap:14px}
.zk .radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zk .radios label{display:grid;gap:2px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.zk .radios label small{font-weight:400;color:var(--muted);font-size:12.5px}
.zk .radios input{position:absolute;opacity:0;pointer-events:none}
.zk .radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.zk .radios label:has(input:disabled){opacity:.5;cursor:default}
.zk .doc{background:#FFFFFF;color:#1B1B1B;border-radius:12px;padding:22px;font-size:13.5px;line-height:1.55;border:1px solid var(--line);display:grid;gap:12px}
.zk .doc .dh{text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#555}
.zk .doc h3{text-align:center;font-size:16px;letter-spacing:.08em}
.zk .doc .sign{display:flex;gap:14px;align-items:center;border:1.5px solid #2C5DA8;color:#2C5DA8;border-radius:10px;padding:10px 12px;font-size:12px}
.zk .doc canvas,.zk .qr{image-rendering:pixelated;flex:none;border-radius:4px;background:#fff}
.zk .toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px);pointer-events:none}
@media (min-width:960px){.zk .toast{bottom:28px}}
.zk .login{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;display:grid;place-items:center;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.zk .login .box{width:100%;max-width:400px;display:grid;gap:20px}
.zk .login h1{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.zk .alt{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.zk .code input{height:54px;text-align:center;font-family:var(--f-mono);font-size:22px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0;width:100%}
.zk .err{color:var(--alert);font-size:13.5px}
@media (prefers-reduced-motion: reduce){.zk *{animation:none!important;transition:none!important}}

/* ===== Профиль: билет + Заявления/Справки, три окна данных ===== */
.zk .pf-top{display:grid;gap:12px;margin-bottom:16px}
@media (min-width:760px){.zk .pf-top{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:stretch}}
.zk .pf-docs{display:grid;gap:12px;align-content:center}
.zk .pf-doc{display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 18px;border-radius:999px;text-align:left;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.zk .pf-doc:active{transform:scale(.97)}
.zk .pf-doc > .i:first-child{width:42px;height:42px;padding:10px;border-radius:50%;background:var(--accent-soft);color:var(--accent);flex:none}
.zk .pf-doc b{display:block;font-family:var(--f-display);font-size:18px;font-weight:600}
.zk .pf-doc small{display:block;color:var(--muted);font-size:13px}
.zk .pf-doc .grow{flex:1;min-width:0}
.zk .pf-info{padding:16px 0 16px}
.zk .pf-info > .seg,.zk .pf-info > p{margin-left:16px;margin-right:16px}
.zk .pf-tabs{margin-bottom:6px}
.zk .pf-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.zk .pf-track::-webkit-scrollbar{display:none}
.zk .pf-pane{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:10px 16px 0}
.zk .pf-pane h2{font-size:16px;margin-bottom:6px}
.zk .pf-list{margin:0}
.zk .pf-row{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;align-items:center}
.zk .pf-row:last-child{border-bottom:0}
.zk .pf-row dt{color:var(--muted)}
.zk .pf-row dd{margin:0;font-weight:500;display:flex;align-items:center;gap:6px;min-width:0}
.zk .pf-v{flex:1;min-width:0;overflow-wrap:anywhere}
.zk .pf-v.masked{letter-spacing:.12em;color:var(--muted)}
.zk .pf-tools{display:flex;gap:4px;flex:none}
.zk .iconbtn.sm{width:32px;height:32px;border-radius:10px}
@media (max-width:480px){.zk .pf-row{grid-template-columns:1fr;gap:2px}.zk .pf-row dt{font-size:13px}}
/* широкий экран: три окна рядом, переключатель не нужен */
@media (min-width:1100px){
  .zk .pf-tabs{display:none}
  .zk .pf-track{overflow:visible;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .zk .pf-pane + .pf-pane{border-left:1px solid var(--line)}
}
.zk .pf-top,.zk .pf-info,.zk .pf-top > *{min-width:0}

/* Токены: палитра Holst + стекло + пружины. Всё «ощущение» настраивается здесь. */
:root {
  --h0: #223A5E; --h1: #355982; --h2: #4D79A8; --h3: #6E9ECC; --h4: #9FC0E3; --h5: #D0E1F2; --h6: #F3F8FD;
  --base: var(--h6);
  --ink: var(--h0); --ink-2: #4a6080;
  --accent: var(--h2);
  --ev0: #355982; --ev1: #4D79A8; --ev2: #6E9ECC; --ev3: #9FC0E3; --ev4: #7f8fc4; --ev5: #C98663;   /* ev5 — свои занятия */
  --bgt: 159,192,227; --ob: 110,158,204; --ow: 159,192,227;   /* оттенок фона и шаров, меняется в Настройках */

  /* слои светлой темы; тёмная переопределяет их ниже */
  --wf: 255,255,255;            /* заливка стекла */
  --hi: #fff;                   /* световая кромка сверху */
  --sh: 34,58,94;               /* тени */
  --ln: 34,58,94;               /* линии и подложки */
  /* сила жидкого стекла: --g от 0 (матовое) до 1, по умолчанию .7; меняется в Настройках */
  --g: .7;
  --gk: calc(.35 + .65 * var(--g) / .7);
  --glass-bg: rgba(var(--wf), calc(.85 - .6 * var(--g)));
  --glass-blur: calc(8px + 23px * var(--g));
  --glass-sat: calc(100% + 100% * var(--g));
  --glass-edge: linear-gradient(135deg, rgba(var(--wf),.95), rgba(var(--wf),.35) 40%, rgba(var(--wf),0) 62%, rgba(var(--wf),.5));
  --glass-shadow: 0 22px 50px -20px rgba(var(--sh),.35), 0 2px 6px rgba(var(--sh),.1), inset 0 1px 0 rgba(var(--wf),.8);
  --r-pill: 999px; --r-card: 28px; --r-cell: 16px;

  --spring-k: 300; --spring-c: 22; --spring-m: .8;   /* док */
  --zoom-k: 260; --zoom-c: 24;                       /* календарь */
  --wave-sigma: 56; --wave-amp: .55; --wave-lift: 10;
  --dock-h: 64px; --gutter: 14px;
  --f-body: "Onest", -apple-system, "SF Pro Text", system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --f-clock: "Space Grotesk", "Onest", system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100dvh; background: var(--base); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--ink-2); margin: 0; }
:focus-visible { outline: 2px solid var(--h2); outline-offset: 3px; }

/* Фон: сферы из Higgsfield, видео-петля поверх картинки */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; contain: strict;
  background:
    radial-gradient(38% 30% at 12% 30%, rgba(159,192,227,.55), transparent 70%),
    radial-gradient(34% 30% at 90% 70%, rgba(110,158,204,.35), transparent 70%),
    radial-gradient(30% 24% at 70% 12%, rgba(208,225,242,.9), transparent 70%),
    radial-gradient(120% 60% at 50% 105%, #d6e2f2 0%, rgba(214,226,242,0) 60%),
    linear-gradient(180deg, #f1f6fd 0%, #e6eef9 55%, #dbe6f4 100%); }
.rays { position: absolute; inset: -20%; opacity: .7; filter: blur(28px);
  background: repeating-linear-gradient(118deg, transparent 0 9%, rgba(255,255,255,.85) 11% 14%, transparent 17% 24%);
  -webkit-mask: radial-gradient(70% 60% at 30% 10%, #000, transparent 75%); mask: radial-gradient(70% 60% at 30% 10%, #000, transparent 75%); }
/* Шар из жидкого стекла: прозрачное тело с оттенком, светлая кромка, блик сверху слева, каустика снизу справа */
.orb { position: absolute; left: 0; top: 0; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2); border-radius: 50%; will-change: transform;
  background:
    radial-gradient(circle at 31% 25%, rgba(255,255,255,.95) 0 2.5%, rgba(255,255,255,.45) 6%, rgba(255,255,255,0) 16%),
    radial-gradient(60% 34% at 50% 14%, rgba(255,255,255,.4), rgba(255,255,255,0) 70%),
    radial-gradient(circle at 64% 80%, rgba(255,255,255,.6), rgba(255,255,255,0) 26%),
    radial-gradient(circle at 50% 50%, rgba(var(--t), .06) 0 50%, rgba(var(--t), .2) 74%, rgba(var(--t), .42) 93%, rgba(255,255,255,.75) 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.6),
    inset calc(var(--d) * -.05) calc(var(--d) * -.07) calc(var(--d) * .14) rgba(53,89,130,.16),
    inset calc(var(--d) * .04) calc(var(--d) * .05) calc(var(--d) * .1) rgba(255,255,255,.55),
    0 calc(var(--d) * .14) calc(var(--d) * .26) calc(var(--d) * -.06) rgba(var(--sh),.14); }
.orb.b { --t: var(--ob); }
.orb.w { --t: var(--ow); }
.orb.far { filter: blur(1.5px); opacity: .8; }

/* Другие фоны из Настроек: тот же рисунок, окрашенный в --bgt; однотонный и фото без шаров */
:root:not([data-bg="spheres"]) .bg { background:
    radial-gradient(38% 30% at 12% 30%, rgba(var(--bgt),.5), transparent 70%),
    radial-gradient(34% 30% at 90% 70%, rgba(var(--ob),.32), transparent 70%),
    radial-gradient(30% 24% at 70% 12%, rgba(var(--ow),.5), transparent 70%),
    linear-gradient(180deg, color-mix(in srgb, rgb(var(--bgt)) 10%, #fff) 0%, color-mix(in srgb, rgb(var(--bgt)) 20%, #fff) 55%, color-mix(in srgb, rgb(var(--bgt)) 30%, #fff) 100%); }
:root[data-scheme="dark"]:not([data-bg="spheres"]) .bg { background:
    radial-gradient(38% 30% at 12% 30%, rgba(var(--bgt),.22), transparent 70%),
    radial-gradient(34% 30% at 90% 70%, rgba(var(--ob),.16), transparent 70%),
    linear-gradient(180deg, color-mix(in srgb, rgb(var(--bgt)) 16%, #0f1d33) 0%, color-mix(in srgb, rgb(var(--bgt)) 10%, #0b1628) 55%, color-mix(in srgb, rgb(var(--bgt)) 6%, #08111f) 100%); }
html:root[data-bg="plain"][data-scheme] .bg { background: linear-gradient(180deg, var(--h6), color-mix(in srgb, var(--h5) 45%, var(--h6))); }
html:root[data-bg="photo"][data-scheme] .bg { background: #8a9bb0 center / cover no-repeat; }
[data-bg="photo"] .bg::after { content: ""; position: absolute; inset: 0; background: rgba(243,248,253,var(--veil)); }
[data-scheme="dark"][data-bg="photo"] .bg::after { background: rgba(8,16,30,.52); }
[data-bg="plain"] .orb, [data-bg="plain"] .rays, [data-bg="photo"] .orb, [data-bg="photo"] .rays { display: none; }

/* Стекло */
.glass { position: relative; background: var(--glass-bg);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)); backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow: var(--glass-shadow); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; background: var(--glass-edge);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  :root { --glass-bg: rgba(250,252,255,.96); }
  .glass { box-shadow: 0 0 0 1px rgba(var(--sh),.55); }
}

.btn { border: 0; border-radius: var(--r-pill); padding: 12px 22px; min-height: 44px; font-weight: 600; background: var(--h1); color: #fff; transition: transform .15s; }
.btn:active { transform: scale(.96); }

/* Вход */
.screen { min-height: 100dvh; }
.login { display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: min(380px, 100%); border-radius: var(--r-card); padding: 32px 24px 24px; display: grid; gap: 14px; text-align: center; animation: rise .7s cubic-bezier(.2,1.3,.4,1) both; }
.login-card h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.login-logo { width: 44px; height: 44px; margin: 0 auto; color: var(--h1); }
.login .field { display: grid; gap: 6px; text-align: left; font-size: 13px; color: var(--ink-2); }
.login .field input { min-height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(var(--ln),.14); background: rgba(var(--wf),.6); outline: none; color: var(--ink); }
.login .field input:focus { border-color: var(--h2); }
.login .hint { margin: 0; font-size: 12px; color: var(--ink-2); }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }
@keyframes fade { from { opacity: 0; } }

/* Смешиваем изображения экранов, чтобы стекло не меняло слой размытия в середине перехода. */
::view-transition { pointer-events: none; }
::view-transition-old(root), ::view-transition-new(root) {
  animation-duration: 240ms;
  animation-timing-function: ease-out;
}
@media (prefers-reduced-motion: reduce) {
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0s; }
}

section.view { min-height: 100dvh; padding: calc(16px + env(safe-area-inset-top)) 16px calc(var(--dock-h) + 40px + env(safe-area-inset-bottom)); }

/* Главная: крупные часы и дата, как в референсе */
.home { display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
.home-top { display: flex; align-items: center; justify-content: space-between; }
.logo-dot { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--h0); color: var(--h6); }
.logo-dot svg { width: 26px; height: 26px; }
.set-btn { width: 48px; height: 48px; border-radius: 50%; border: 0; display: grid; place-items: center; color: var(--h0); transition: transform .2s cubic-bezier(.3,1.5,.5,1); }
.set-btn:active { transform: scale(.9); }
.set-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
.set-btn:hover svg { transform: rotate(60deg); }

/* «Назад»: стеклянная капля со стрелкой, на всех экранах кроме главной */
.back { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--h0); cursor: pointer;
  border: 1px solid rgba(var(--wf),.7); background: rgba(var(--wf),.55); -webkit-backdrop-filter: blur(calc(16px * var(--gk))) saturate(160%); backdrop-filter: blur(calc(16px * var(--gk))) saturate(160%);
  box-shadow: 0 2px 10px rgba(var(--sh),.1); transition: transform .2s cubic-bezier(.3,1.5,.5,1), background .2s; }
.back:hover { background: rgba(var(--wf),.8); }
.back:active { transform: scale(.88); }
.back:focus-visible { outline: 2px solid var(--h0); outline-offset: 2px; }
.back svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transform: translateX(-1px); }
.cal-top .back { margin-left: -4px; }
.zk .page-h { align-items: center; justify-content: flex-start; }
.zk .page-h h1 { margin-right: auto; }
.home-center { margin: auto 0; padding: 2vh 0 4vh; display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 4vh, 40px); }
.clock-row { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 32px); }
.clock-big { font-family: var(--f-clock); color: var(--h0); font-variant-numeric: tabular-nums; white-space: nowrap;
  font-size: clamp(74px, 24vw, 196px); font-weight: 600; line-height: .84; letter-spacing: -.05em; }
.clock-big .colon { display: inline-block; margin: 0 -.02em; transform: translateY(-.06em); opacity: .55; }
.clock-side { display: flex; flex-direction: column; align-items: flex-start; gap: clamp(10px, 2vh, 18px); }
.clock-side .date { font-family: var(--f-clock); color: var(--h0); font-size: clamp(22px, 6vw, 44px); line-height: 1.05; font-weight: 500; letter-spacing: -.02em; }
.clock-side .date span { display: block; }

/* Поиск: стеклянная кнопка у часов раскрывается в строку с результатами */
.s-btn { width: 52px; height: 52px; border: 0; border-radius: 50%; display: grid; place-items: center; color: var(--h0); transition: transform .2s cubic-bezier(.3,1.5,.5,1); }
.s-btn:active { transform: scale(.9); }
.s-btn svg, .s-ic, .s-x svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }
.s-btn[aria-expanded="true"] { visibility: hidden; }
.search { position: fixed; inset: 0; z-index: 40; }
.s-scrim { position: absolute; inset: 0; background: rgba(var(--sh),.12); -webkit-backdrop-filter: blur(calc(6px * var(--gk))); backdrop-filter: blur(calc(6px * var(--gk))); opacity: var(--p, 1); }
.s-pill { position: absolute; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 14px; overflow: hidden; border-radius: var(--r-pill); color: var(--h0);
  --glass-bg: rgba(var(--wf),.55); }
@media (hover: hover) and (pointer: fine) { .chromium .s-pill, .chromium .s-res { -webkit-backdrop-filter: url(#refract) blur(var(--glass-blur)) saturate(var(--glass-sat)); backdrop-filter: url(#refract) blur(var(--glass-blur)) saturate(var(--glass-sat)); } }
.s-ic { flex: none; }

.s-x { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(var(--ln),.07); display: grid; place-items: center; opacity: var(--pi, 1); }
.s-x svg { width: 18px; height: 18px; }
.s-res { position: absolute; border-radius: var(--r-card); overflow: auto; overscroll-behavior: contain; padding: 8px; --glass-bg: rgba(var(--wf),.62);
  transform-origin: 50% 0; opacity: var(--pr, 1); transform: translateY(calc((1 - var(--pr, 1)) * -14px)) scale(calc(.96 + var(--pr, 1) * .04)); }
.s-res:empty, .s-res:has(#s-list:empty) { display: none; }
.s-g { margin: 10px 12px 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }

.s-it { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 12px; border: 0; border-radius: 16px; background: none; text-align: left; }
.s-it[aria-selected="true"] { background: rgba(var(--wf),.75); box-shadow: 0 6px 18px -10px rgba(var(--sh),.35); }
.s-it .ico { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(77,121,168,.12); color: var(--h1); }
.s-it .ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.s-it b { display: block; font-weight: 600; }
.s-it small { display: block; color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-it span { min-width: 0; }
.s-it mark { background: rgba(110,158,204,.3); color: inherit; border-radius: 4px; }
.s-empty { padding: 18px 12px; color: var(--ink-2); margin: 0; }
.next { text-align: center; max-width: 560px; }
.next-big { font-size: clamp(26px, 6.4vw, 44px); line-height: 1.08; font-weight: 500; letter-spacing: -.02em; margin: 4px 0 0; text-wrap: balance; }
.next-meta { margin: 8px 0 0; font-size: 15px; color: var(--ink-2); }

/* Док */
.dock { position: fixed; left: 50%; bottom: calc(var(--gutter) + env(safe-area-inset-bottom)); transform: translateX(-50%); height: var(--dock-h); padding: 0 8px; z-index: 20;
  touch-action: none; user-select: none; -webkit-user-select: none; transition: transform .35s cubic-bezier(.3,1.4,.5,1), opacity .35s; }
.dock-bg { position: absolute; inset: 0; border-radius: var(--r-pill); will-change: transform; }
.dock-items { position: relative; display: flex; height: 100%; align-items: center; }
.dock-item { position: relative; width: 56px; height: 52px; border: 0; background: none; padding: 0; display: grid; place-items: center; border-radius: var(--r-pill);
  color: var(--ink-2); will-change: transform; -webkit-tap-highlight-color: transparent; }
.dock-item svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.dock-item[aria-current="page"] { color: var(--h0); }
.dock-lens { position: absolute; top: 6px; left: 0; width: 56px; height: 52px; border-radius: var(--r-pill); pointer-events: none;
  background: radial-gradient(120% 120% at 30% 20%, rgba(var(--wf),.95), rgba(var(--wf),.4) 60%), rgba(159,192,227,.35);
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 rgba(var(--sh),.08), 0 6px 16px -6px rgba(var(--sh),.35); will-change: transform; }
.dock-tip { position: absolute; bottom: calc(100% + 10px); left: 0; padding: 5px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 500; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .18s; }
.dock-tip.on { opacity: 1; }
.ripple { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(var(--wf),.9), rgba(var(--wf),0) 70%); animation: ripple .6s ease-out forwards; }
@keyframes ripple { to { transform: scale(14); opacity: 0; } }
@media (max-width: 400px) { .dock-item, .dock-lens { width: 52px; } }

/* Календарь: шапка-стекло, лента дней, сцена с уровнями зума, боковые переключатели */
.cal { display: flex; flex-direction: column; gap: 10px; height: 100dvh; max-width: 1180px; margin: 0 auto; }
.cal-head { border-radius: 26px; padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.cal-top { display: flex; align-items: center; gap: 10px; padding: 2px 4px 0 8px; }
.cal-ttl { flex: 1; min-width: 0; }
.cal-ttl h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.cal-ttl p { margin: 0; font-size: 13px; color: var(--ink-2); min-height: 1.3em; }
.chip-btn { height: 38px; border: 0; border-radius: var(--r-pill); padding: 0 16px; background: rgba(var(--wf),.7); font-weight: 600; font-size: 14px; color: var(--h1);
  box-shadow: inset 0 1px 0 var(--hi), 0 2px 8px -4px rgba(var(--sh),.3); transition: opacity .25s, transform .2s cubic-bezier(.3,1.5,.5,1); }
.chip-btn:active { transform: scale(.95); }
.chip-btn.dim { opacity: .45; }
.cal-head .seg { position: relative; display: flex; padding: 3px; border-radius: var(--r-pill); background: rgba(var(--ln),.07); }
.cal-head .seg button { position: relative; flex: 1; height: 34px; border: 0; background: none; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.cal-head .seg button[aria-checked="true"] { color: var(--h0); font-weight: 600; }
.seg-lens { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 4); border-radius: var(--r-pill); background: rgba(var(--wf),.92);
  box-shadow: 0 2px 8px -2px rgba(var(--sh),.25); transition: transform .45s cubic-bezier(.3,1.25,.5,1); }
@media (min-width: 760px) { .cal-head { grid-template-columns: minmax(0, 1fr) 360px; align-items: center; } .strip { grid-column: 1 / -1; } }

/* лента дней недели: выбранный день — стеклянная линза, которая переезжает */
.strip { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); touch-action: pan-y; }
.strip-lens { position: absolute; top: 0; bottom: 0; left: 0; width: calc(100% / 7); border-radius: 18px; background: rgba(var(--wf),.9);
  box-shadow: inset 0 1px 0 var(--hi), 0 6px 16px -8px rgba(var(--sh),.4); transition: transform .42s cubic-bezier(.3,1.2,.5,1); pointer-events: none; }
.sd { position: relative; border: 0; background: none; padding: 6px 0 7px; border-radius: 18px; display: grid; justify-items: center; gap: 1px; color: var(--ink-2); }
.sd span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.sd b { font-size: 18px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; width: 32px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
.sd.today b { color: var(--h2); }
.sd.today span { color: var(--h2); font-weight: 600; }
.sd .dd { display: flex; gap: 3px; height: 5px; }
.sd .dd i { width: 5px; height: 5px; border-radius: 50%; background: var(--h3); opacity: .8; }
.sd.sel b { color: var(--h0); }

.cal-body { position: relative; flex: 1; min-height: 0; }
.cal-stage { position: absolute; inset: 0; touch-action: pan-y; overflow: hidden; border-radius: 24px; outline-offset: -2px; }
.lvl { position: absolute; inset: 0; display: none; will-change: transform, opacity; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.lvl::-webkit-scrollbar { display: none; }
.lvl.on { display: block; }
.lvl.ghost { display: block; pointer-events: none; z-index: 1; }

/* боковые переключатели: тонкие стеклянные «язычки», почти незаметны, проявляются при наведении */
.side { position: absolute; top: 50%; z-index: 3; width: 26px; height: 64px; margin-top: -32px; border: 0; padding: 0; display: grid; place-items: center; color: var(--h1);
  background: rgba(var(--wf),.3); -webkit-backdrop-filter: blur(calc(14px * var(--gk))) saturate(160%); backdrop-filter: blur(calc(14px * var(--gk))) saturate(160%);
  box-shadow: inset 0 0 0 1px rgba(var(--wf),.55), 0 6px 18px -10px rgba(var(--sh),.4); opacity: .55; transition: opacity .25s, transform .25s cubic-bezier(.3,1.5,.5,1), background .25s; }
.side.l { left: -14px; border-radius: 0 16px 16px 0; }
.side.r { right: -14px; border-radius: 16px 0 0 16px; }
.side svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.side:hover, .side:focus-visible { opacity: 1; background: rgba(var(--wf),.6); }
.side.l:active { transform: translateX(-3px) scale(.94); }
.side.r:active { transform: translateX(3px) scale(.94); }
@media (min-width: 760px) { .side { width: 34px; height: 76px; margin-top: -38px; } .side.l { left: -20px; } .side.r { right: -20px; } }
/* телефон: язычки стоят в своих полях и не закрывают пары, зона касания шире самого язычка */
@media (max-width: 759px) {
  .lvl { padding-inline: 14px; }
  .side { width: 24px; height: 72px; margin-top: -36px; }
  .side.l { left: -12px; } .side.r { right: -12px; }
  .side::after { content: ""; position: absolute; inset: -12px 0; }
  .side.l::after { right: -12px; } .side.r::after { left: -12px; }
}
@media (hover: none) { .side { opacity: .85; background: rgba(var(--wf),.55); } }

.cell { position: relative; border: 0; text-align: left; color: inherit; border-radius: var(--r-cell); background: rgba(var(--wf), calc(.4 + .22 * var(--wv, 0)));
  -webkit-backdrop-filter: blur(calc(10px * var(--gk))); backdrop-filter: blur(calc(10px * var(--gk)));
  box-shadow: inset 0 1px 0 rgba(var(--wf),.9), 0 calc(1px + 10px * var(--wv, 0)) calc(2px + 22px * var(--wv, 0)) calc(-10px * var(--wv, 0)) rgba(var(--sh), calc(.06 + .26 * var(--wv, 0)));
  transition: transform .3s cubic-bezier(.3,1.4,.5,1), translate .5s cubic-bezier(.3,1.35,.5,1), scale .5s cubic-bezier(.3,1.35,.5,1), background .25s, box-shadow .25s; }
@media (hover: hover) { .cell:hover { background: rgba(var(--wf),.66); } }
.cell:focus-visible { background: rgba(var(--wf),.6); }
.cell:active { transform: scale(.97); }
.cell.today { background: rgba(var(--wf),.78); box-shadow: inset 0 0 0 1.5px var(--h3), inset 0 1px 0 var(--hi); }
.cell.dim { opacity: .45; }
.pulse { animation: pulse .9s ease-out; }
@keyframes pulse { 40% { box-shadow: inset 0 0 0 2px var(--h2), 0 0 26px var(--h4); } }
.num { font-variant-numeric: tabular-nums; }

.yr { min-height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 8px; }
@media (min-width: 760px) { .yr { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1200px) { .yr { grid-template-columns: repeat(6, 1fr); } }
.mini { padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.mini.today b { color: var(--h2); }
.mini b { font-size: 12px; font-weight: 600; }
.mini-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; align-content: start; }
.mini-grid i { aspect-ratio: 1; border-radius: 50%; background: rgba(53,89,130,calc(.08 + var(--h) * .6)); max-width: 12px; }
.mini-grid i.e { visibility: hidden; }
.mini-grid i.t { background: var(--h2); box-shadow: 0 0 0 2px var(--h4); }

.mo { height: 100%; min-height: 330px; display: grid; grid-template-rows: auto repeat(6, 1fr); gap: 5px; }
.wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; font-size: 11px; color: var(--ink-2); text-align: center; text-transform: uppercase; letter-spacing: .06em; padding: 2px 0; }
.mo-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; min-height: 0; }
.day { padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; min-height: 0; overflow: hidden; align-items: center; }
.day .num { font-size: 14px; font-weight: 600; }
.day.today .num { color: var(--h2); }
.dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.tchip { display: none; font-size: 10.5px; line-height: 1.25; padding: 2px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: stretch;
  background: color-mix(in srgb, var(--c) 18%, rgba(var(--wf),.6)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent); }
@media (min-width: 760px) { .day { align-items: stretch; } .day .dots { display: none; } .tchip { display: block; } }

/* неделя: на телефоне список дней, на большом экране 7 колонок */
.wk { display: grid; gap: 6px; grid-template-columns: 1fr; padding-bottom: 8px; }
.wcol { padding: 10px 12px; display: grid; grid-template-columns: 44px 1fr; align-items: start; gap: 4px 10px; min-height: 64px; }
.wcol .wh { grid-row: span 9; text-align: center; font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.wcol .wh .num { display: block; font-size: 22px; color: var(--ink); font-weight: 600; text-transform: none; letter-spacing: 0; }
.wcol.today .wh, .wcol.today .wh .num { color: var(--h2); }
.wcol .wfree { align-self: center; color: var(--ink-2); font-size: 13px; }
.echip { display: flex; gap: 8px; align-items: baseline; min-width: 0; border-radius: 10px; padding: 6px 9px; font-size: 13px; line-height: 1.3;
  background: color-mix(in srgb, var(--c) 18%, rgba(var(--wf),.65)); box-shadow: inset 3px 0 0 var(--c), inset 0 1px 0 var(--hi); }
.echip time { flex: none; color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 12px; }
.echip .full { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.echip .sh { display: none; }
.echip.ov { box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px rgba(196,120,60,.5); }
@media (min-width: 760px) {
  .wk { height: 100%; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 0; }
  .wcol { display: flex; flex-direction: column; align-items: stretch; padding: 8px 5px; gap: 5px; min-height: 0; overflow: hidden; }
  .wcol .wh { margin-bottom: 4px; }
  .wcol .wfree { align-self: center; margin-top: 30%; }
  .echip { display: block; padding: 5px 6px 5px 8px; font-size: 11.5px; }
  .echip time { display: block; font-size: 10.5px; }
  .echip .full { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; }
}

/* день: лента пар с перерывами */
.dy { position: relative; min-height: 100%; max-width: 680px; margin: 0 auto; padding: 4px 2px 24px; }
.agenda { list-style: none; margin: 0; padding: 0; display: grid; }
.ag { display: grid; grid-template-columns: 50px 1fr; gap: 10px; align-items: stretch; }
.ag-time { padding-top: 12px; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.25; }
.ag-time b { display: block; font-size: 15px; font-weight: 600; }
.ag-time span { font-size: 12.5px; color: var(--ink-2); }
.ag-card { position: relative; display: grid; gap: 3px; text-align: left; border: 0; color: inherit; width: 100%; padding: 12px 14px 12px 18px; border-radius: 20px; overflow: hidden;
  background: rgba(var(--wf),.5); -webkit-backdrop-filter: blur(calc(16px * var(--gk))) saturate(160%); backdrop-filter: blur(calc(16px * var(--gk))) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(var(--wf),.95), inset 0 0 0 1px rgba(var(--wf),.4), 0 10px 26px -16px rgba(var(--sh),.45);
  transition: transform .3s cubic-bezier(.3,1.4,.5,1), background .2s; }
.ag-card::before { content: ""; position: absolute; left: 6px; top: 12px; bottom: 12px; width: 4px; border-radius: 4px; background: var(--c); }
@media (hover: hover) { .ag-card:hover { background: rgba(var(--wf),.68); transform: translateY(-1px); } }
.ag-card:active { transform: scale(.98); }
.ag-card b { font-size: 16px; font-weight: 600; line-height: 1.25; }
.ag-card small { font-size: 13px; color: var(--ink-2); }
.ag-card.done { opacity: .55; }
.ag-card.live { background: rgba(var(--wf),.8); box-shadow: inset 0 0 0 1.5px var(--h3), inset 0 1px 0 var(--hi), 0 14px 30px -14px rgba(53,89,130,.55); }
.ag-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 2px 8px; border-radius: 99px; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--h1); }
.tag.live { background: var(--h2); color: #fff; }
.tag.warn { background: rgba(196,120,60,.15); color: #8a4d1c; }
.tag.own { background: color-mix(in srgb, var(--ev5) 20%, transparent); color: #8a4d2c; }
[data-scheme="dark"] .tag.own { color: #EDB596; }
/* Долгое нажатие: кольцо дорисовывается за 0,52 с, потом открывается форма */
.lp-ring { position: fixed; z-index: 60; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(var(--wf),.55) 0 40%, transparent 70%); box-shadow: inset 0 0 0 2px var(--h3); animation: lp .52s cubic-bezier(.3,.7,.4,1) forwards; }
@keyframes lp { from { transform: scale(.45); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.lp-ring { animation-duration: .34s; }
.lp-hint { margin: 14px auto 4px; text-align: center; font-size: 12.5px; color: var(--ink-2); opacity: .8; }
.cal-body { -webkit-touch-callout: none; }
.zk .my-form { display: grid; gap: 14px; }
.zk .my-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .zk .my-row { grid-template-columns: 1fr 1fr; } .zk .my-row .field:first-child { grid-column: 1 / -1; } }
.ag-prog { display: block; height: 4px; margin-top: 6px; border-radius: 4px; background: rgba(var(--ln),.1); overflow: hidden; }
.ag-prog i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--h3), var(--h2)); }
.ag-gap { display: grid; grid-template-columns: 50px 1fr; gap: 10px; height: 30px; align-items: center; }
.ag-gap span { grid-column: 2; font-size: 12px; color: var(--ink-2); padding-left: 18px; display: flex; align-items: center; gap: 8px; }
.ag-gap span::after { content: ""; flex: 1; border-top: 1px dashed rgba(var(--ln),.18); }
.ag-gap.win { height: 44px; }
.ag-gap.win span { color: var(--h1); font-weight: 500; }

/* час (только щипком): сетка по 15 минут */
.hours { display: flex; flex-direction: column; }
.hours div { flex: 1; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; transform: translateY(-.6em); }
.lvl .track { position: relative; display: flex; flex-direction: column; }
.hrow { flex: 1; border: 0; border-top: 1px solid rgba(var(--ln),.1); background: none; padding: 0; border-radius: 0; }
.ev { position: absolute; display: flex; flex-direction: column; justify-content: flex-start; border: 0; text-align: left; color: inherit; border-radius: 14px; padding: 8px 10px; overflow: hidden; font-size: 13px; line-height: 1.3;
  background: color-mix(in srgb, var(--c) 22%, rgba(var(--wf),.6)); -webkit-backdrop-filter: blur(calc(12px * var(--gk))); backdrop-filter: blur(calc(12px * var(--gk)));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 50%, transparent), inset 0 1px 0 var(--hi), 0 8px 20px -10px rgba(var(--sh),.35); }
.ev b { display: block; font-weight: 600; }
.ev small { display: block; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lvl .now { position: absolute; left: -6px; right: 0; height: 2px; background: var(--h2); box-shadow: 0 0 10px var(--h3); pointer-events: none; z-index: 3; }
.lvl .now span { position: absolute; left: -40px; top: -11px; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 9px; font-variant-numeric: tabular-nums;
  background: rgba(var(--wf),.8); -webkit-backdrop-filter: blur(calc(10px * var(--gk))); backdrop-filter: blur(calc(10px * var(--gk))); box-shadow: inset 0 0 0 1px rgba(77,121,168,.4); }
.hr { height: 100%; display: grid; grid-template-columns: 58px 1fr; padding: 14px 0 0 6px; }
.hr .hours div { font-size: 13px; }
.hr .ev { font-size: 15px; padding: 14px 16px; }
.hr .ev small { font-size: 13px; margin-top: 4px; }
.free { margin: 12vh auto 0; max-width: 340px; border-radius: 24px; padding: 22px 18px; text-align: center; display: grid; gap: 6px; justify-items: center; }
.free b { font-size: 18px; }
.free .chip-btn { margin-top: 8px; height: auto; min-height: 38px; padding: 8px 16px; }
.hr .free { position: absolute; inset: 30% 10% auto; margin: 0; }

/* Разделы из «Зачётки»: токены шаблона → Holst и стекло */
.zk { --bg: transparent; --surface: rgba(var(--wf), calc(.55 + .4 * (1 - min(1, var(--gk))))); --surface-2: rgba(var(--wf), calc(.4 + .4 * (1 - min(1, var(--gk))))); --ink: var(--h0); --muted: var(--ink-2); --line: rgba(var(--ln),.12);
  --accent: var(--h1); --accent-ink: #fff; --accent-soft: var(--h5); --mark: var(--h4); --mark-ink: var(--h0);
  --shadow: 0 1px 2px rgba(var(--sh),.06), 0 8px 24px rgba(var(--sh),.08);
  --f-display: var(--f-clock); --f-body: "Onest", system-ui, sans-serif; height: auto; }
.zk .card, .zk .subj, .zk .req, .zk .cat, .zk .seg { -webkit-backdrop-filter: blur(calc(20px * var(--gk))) saturate(160%); backdrop-filter: blur(calc(20px * var(--gk))) saturate(160%); box-shadow: var(--shadow); }
.zk .idcard { background: linear-gradient(135deg, var(--h0), var(--h1)); color: var(--h6); }
.zk .toast { color: var(--h6); bottom: calc(var(--dock-h) + 30px + env(safe-area-inset-bottom)); }
.zk .sheet { background: rgba(243,248,253,.92); -webkit-backdrop-filter: blur(calc(24px * var(--gk))); backdrop-filter: blur(calc(24px * var(--gk))); }
.zk .sheet-wrap { background: rgba(var(--sh),.3); }
.zk .page-h h1 { font-size: clamp(30px, 7vw, 44px); letter-spacing: -.03em; }
#v-zk { max-width: 1140px; margin: 0 auto; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .12s !important; }
  .cell:hover, .ev:hover { transform: none; }
  /* правило выше включает переходы для всех свойств (transition-property по умолчанию all); поиск и шары двигает JS */
  .search, .search *, .orb { transition-property: none !important; }
}
@media (max-width: 400px) { .cal-ttl h2 { font-size: 18px; } }

/* ===== Тёмная тема: html[data-scheme="dark"] (режим «Авто» выставляет его по системе) ===== */
:root[data-scheme="dark"] {
  --h0: #EAF2FB; --h1: #BCD3EE; --h2: #8DB4E0; --h3: #6E9ECC; --h4: #3F6894; --h5: #22395A; --h6: #0B1626;
  --ink-2: #9AB0CC;
  --wf: 30,47,74; --hi: rgba(255,255,255,.14); --sh: 0,0,0; --ln: 200,220,245;
  --glass-edge: linear-gradient(135deg, rgba(255,255,255,.38), rgba(255,255,255,.08) 40%, rgba(255,255,255,0) 62%, rgba(255,255,255,.18));
  --glass-shadow: 0 22px 50px -20px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.12);
  color-scheme: dark;
}
[data-scheme="dark"] .bg { background:
    radial-gradient(38% 30% at 12% 30%, rgba(77,121,168,.35), transparent 70%),
    radial-gradient(34% 30% at 90% 70%, rgba(110,158,204,.22), transparent 70%),
    radial-gradient(30% 24% at 70% 12%, rgba(53,89,130,.5), transparent 70%),
    linear-gradient(180deg, #0f1d33 0%, #0b1628 55%, #08111f 100%); }
[data-scheme="dark"] .rays { opacity: .12; }
[data-scheme="dark"] .orb { opacity: .62; }
[data-scheme="dark"] .btn, [data-scheme="dark"] .tag.live { color: var(--h6); }
[data-scheme="dark"] .tag.warn { color: #E7AD78; }
[data-scheme="dark"] .zk .idcard { background: linear-gradient(135deg, #2B4C78, #172D4B); color: #F3F8FD; }
[data-scheme="dark"] .zk .sheet { background: rgba(14,26,44,.95); }
[data-scheme="dark"] .zk .toast { color: var(--h6); }
[data-scheme="dark"] .zk { --accent-ink: var(--h6);
  --alert: #FF8E74; --alert-soft: rgba(200,69,42,.22); --warn: #E9B460; --warn-soft: rgba(154,101,20,.25); --ok: #74D39C; --ok-soft: rgba(37,128,79,.25); }
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) { :root[data-scheme="dark"] { --glass-bg: rgba(14,26,44,.96); } }

/* ===== Стили часов на главной: html[data-clock="classic|thin|stack"] ===== */
[data-clock="thin"] .clock-big { font-family: var(--f-body); font-weight: 200; letter-spacing: -.06em; font-size: clamp(64px, 21vw, 196px); }
[data-clock="thin"] .clock-big .colon { opacity: .35; transform: translateY(-.08em); animation: blink 2s steps(1) infinite; }
[data-clock="thin"] .clock-side .date { font-family: var(--f-body); font-weight: 300; }
@keyframes blink { 50% { opacity: .1; } }
[data-clock="stack"] .clock-big { display: flex; flex-direction: column; font-weight: 600; line-height: .8; letter-spacing: -.06em; font-size: clamp(88px, 30vw, 200px); }
[data-clock="stack"] .clock-big .colon { display: none; }
[data-clock="stack"] #c-mm { color: var(--h2); }
[data-clock="stack"] .clock-side .date { font-size: clamp(24px, 7vw, 48px); }

/* ===== Универсальный доступ ===== */
.big-text #v-zk, .big-text .next { zoom: 1.12; }
/* «Меньше движения» из настроек работает как системный reduced-motion */
.calm *, .calm *::before, .calm *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .12s !important; }
.calm .search, .calm .search *, .calm .orb { transition-property: none !important; }

/* ===== Настройки → Внешний вид ===== */
.ap-row { display: grid; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.ap-row:first-of-type { padding-top: 4px; }
.ap-row:last-child { border-bottom: 0; padding-bottom: 0; }
.ap-row > b { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ap-row > b small { font-weight: 500; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
/* переключатель темы: солнце · авто · луна, стеклянная капля переезжает */
.theme-sw { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: var(--r-pill); background: rgba(var(--ln),.08); box-shadow: inset 0 1px 2px rgba(var(--sh),.08); }
.theme-sw button { position: relative; z-index: 1; height: 44px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--ink-2); transition: color .25s; }
.theme-sw button[aria-checked="true"] { color: var(--h0); }
.theme-sw svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.theme-sw .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: var(--r-pill);
  background: radial-gradient(120% 120% at 30% 20%, rgba(var(--wf),.98), rgba(var(--wf),.6) 70%); box-shadow: inset 0 1px 0 var(--hi), 0 4px 14px -4px rgba(var(--sh),.35);
  transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .5s cubic-bezier(.3,1.3,.5,1); }
/* ползунок силы стекла */
.glass-rng { display: grid; gap: 6px; }
.glass-rng input { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: none; cursor: pointer; --v: 70%; }
.glass-rng input::-webkit-slider-runnable-track { height: 14px; border-radius: 99px; background: linear-gradient(90deg, var(--h3), var(--h2)) 0 / var(--v) 100% no-repeat, rgba(var(--ln),.1); box-shadow: inset 0 1px 2px rgba(var(--sh),.15); }
.glass-rng input::-moz-range-track { height: 14px; border-radius: 99px; background: linear-gradient(90deg, var(--h3), var(--h2)) 0 / var(--v) 100% no-repeat, rgba(var(--ln),.1); }
.glass-rng input::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -8px; border-radius: 50%; border: 0;
  background: radial-gradient(circle at 32% 28%, #fff 0 12%, rgba(255,255,255,.55) 30%, rgba(159,192,227,.35) 70%, rgba(255,255,255,.85) 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.8), 0 4px 12px -2px rgba(var(--sh),.4); transition: transform .25s cubic-bezier(.3,1.5,.5,1); }
.glass-rng input::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; border: 0; background: radial-gradient(circle at 32% 28%, #fff 0 12%, rgba(159,192,227,.5) 70%, #fff 100%); box-shadow: 0 4px 12px -2px rgba(var(--sh),.4); }
.glass-rng input:active::-webkit-slider-thumb { transform: scale(1.18); }
.glass-rng .ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); }
/* стили часов: три карточки с превью */
.clock-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.clock-pick button { display: grid; gap: 6px; justify-items: center; padding: 14px 6px 10px; border-radius: 18px; background: rgba(var(--wf),.5); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; color: var(--ink-2); transition: transform .25s cubic-bezier(.3,1.5,.5,1), box-shadow .2s; }
.clock-pick button:active { transform: scale(.95); }
.clock-pick button[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--h2), 0 6px 16px -8px rgba(var(--sh),.4); color: var(--h0); font-weight: 600; }
.clock-pick .pv { height: 52px; display: grid; place-items: center; color: var(--h0); font-family: var(--f-clock); font-weight: 600; font-size: 30px; letter-spacing: -.05em; line-height: .82; font-variant-numeric: tabular-nums; }
.clock-pick .pv.thin { font-family: var(--f-body); font-weight: 200; font-size: 32px; letter-spacing: -.03em; }
.clock-pick .pv.stack { font-size: 24px; text-align: center; }
.clock-pick .pv.stack i { font-style: normal; display: block; color: var(--h2); }
.ap-link { display: flex; align-items: center; gap: 12px; width: 100%; padding: 4px 0; text-align: left; font-weight: 600; font-size: 15px; }
.ap-link .grow { flex: 1; }
.ap-link small { display: block; font-weight: 400; color: var(--ink-2); font-size: 13px; }
.ap-link .go { width: 44px; height: 32px; border-radius: 99px; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--h2); color: var(--h1); }
.ap-link .go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 959px) { .zk .set-look { order: -1; } }
/* редактор дока */
.dk-preview { display: flex; justify-content: center; gap: 4px; padding: 8px; border-radius: var(--r-pill); margin: 0 auto 6px; width: max-content; max-width: 100%; }
.dk-preview span { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); }
.dk-preview svg, .dk-row svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.dk-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.dk-row:last-child { border-bottom: 0; }
.dk-row.off .dk-name, .dk-row.off .dk-icons { opacity: .45; }
.dk-name { flex: 1; min-width: 0; font-weight: 500; }
.dk-name small { display: block; color: var(--ink-2); font-size: 12.5px; font-weight: 400; }
.dk-icons { display: flex; gap: 4px; }
.dk-icons button { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--ink-2); }
.dk-icons button[aria-checked="true"] { background: rgba(var(--wf),.85); color: var(--h0); box-shadow: inset 0 0 0 1.5px var(--h2); }
.dk-move { display: flex; flex-direction: column; gap: 2px; }
.dk-move button { width: 30px; height: 22px; border-radius: 7px; display: grid; place-items: center; color: var(--h1); }
.dk-move button:disabled { opacity: .25; cursor: default; }
@media (pointer: coarse) { .dk-move button { width: 38px; height: 30px; border-radius: 10px; } }
.dk-move svg { width: 16px; height: 16px; }
@media (max-width: 420px) { .dk-icons button { width: 32px; height: 32px; } .dk-row { gap: 6px; } }
/* правки после просмотра */
[data-scheme="dark"] .theme-sw .knob { background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,.26), rgba(255,255,255,.1) 70%); }
[data-scheme="dark"] .zk .toggle span { background: rgba(200,220,245,.2); }
[data-scheme="dark"] .zk .toggle span::after { background: #EAF2FB; }
.zk .page-h { flex-wrap: nowrap; }
.zk .page-h h1 { min-width: 0; text-wrap: balance; line-height: 1.05; }
@media (max-width: 420px) { .zk .page-h h1 { font-size: clamp(26px, 7.4vw, 30px); } }
[data-scheme="dark"] .zk .toggle input:checked + span::after { background: var(--h6); }
[data-scheme="dark"] .zk .idcard::after { opacity: .16; }

/* ===== Документы: три кнопки-пилюли + «Мои заявки» ===== */
.zk .docs-grid { display: grid; gap: 16px; }
.zk .docs-acts { display: grid; gap: 12px; align-content: start; }
@media (min-width: 960px) { .zk .docs-grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } .zk .docs-acts { order: 2; position: sticky; top: 16px; } }
.zk .docs-act { display: flex; align-items: center; gap: 14px; min-height: 84px; padding: 14px 20px 14px 16px; border-radius: 999px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--ink);
  -webkit-backdrop-filter: blur(calc(20px * var(--gk))) saturate(160%); backdrop-filter: blur(calc(20px * var(--gk))) saturate(160%);
  transition: transform .3s cubic-bezier(.3,1.4,.5,1), box-shadow .2s; }
.zk .docs-act:hover { box-shadow: 0 14px 30px -14px rgba(var(--sh),.45); }
.zk .docs-act:active { transform: scale(.97); }
.zk .docs-act > .i:first-child { flex: none; width: 46px; height: 46px; padding: 11px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.zk .docs-act .grow { flex: 1; min-width: 0; }
.zk .docs-act b { display: block; font-family: var(--f-display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.zk .docs-act small { display: block; color: var(--muted); font-size: 13px; }
.zk .docs-act.main { background: linear-gradient(135deg, var(--h1), var(--h2)); color: #fff; border-color: transparent; }
.zk .docs-act.main small { color: rgba(255,255,255,.78); }
.zk .docs-act.main > .i:first-child { background: rgba(255,255,255,.2); color: #fff; }
[data-scheme="dark"] .zk .docs-act.main { background: linear-gradient(135deg, #3F6894, #2B4C78); }

/* ===== Стеклянное окно выбора по центру ===== */
.zk .gm-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px;
  background: rgba(var(--sh),.22); -webkit-backdrop-filter: blur(calc(8px * var(--gk))); backdrop-filter: blur(calc(8px * var(--gk))); }
.zk .gm { width: min(580px, 100%); max-height: min(84dvh, 760px); display: flex; border-radius: 32px; transform-origin: 50% 50%; will-change: transform;
  --glass-bg: rgba(var(--wf), calc(.92 - .45 * var(--g))); color: var(--ink); overflow: hidden; }
.chromium .zk .gm { -webkit-backdrop-filter: url(#refract) blur(var(--glass-blur)) saturate(var(--glass-sat)); backdrop-filter: url(#refract) blur(var(--glass-blur)) saturate(var(--glass-sat)); }
.zk .gm-in { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px 18px 8px; }
.zk .gm-h { display: flex; align-items: center; gap: 10px; }
.zk .gm-h h2 { flex: 1; font-family: var(--f-display); font-size: 22px; font-weight: 600; letter-spacing: -.02em; padding: 10px 18px; border-radius: 999px;
  background: rgba(var(--wf),.6); box-shadow: inset 0 1px 0 var(--hi), inset 0 0 0 1px var(--line); }
.zk .gm-h .iconbtn { border-radius: 50%; width: 44px; height: 44px; background: rgba(var(--wf),.6); }
.zk .gm-q { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 999px; background: rgba(var(--wf),.7); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 2px rgba(var(--sh),.08); color: var(--muted); }
.zk .gm-q:focus-within { box-shadow: inset 0 0 0 2px var(--h2); }
.zk .gm-q svg { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; flex: none; }
.zk .gm-q input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 16px; color: var(--ink); }
.zk .gm-q input::-webkit-search-cancel-button { display: none; }
.zk .gm-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0 -18px; padding: 2px 18px 14px; display: grid; gap: 8px; align-content: start; scrollbar-width: thin; }
.zk .gm-it { border-radius: 22px; background: rgba(var(--wf),.45); box-shadow: inset 0 0 0 1px var(--line); transition: background .25s, box-shadow .25s; }
.zk .gm-it.open { background: rgba(var(--wf),.75); box-shadow: inset 0 0 0 1.5px var(--h3), 0 10px 26px -16px rgba(var(--sh),.45); }
.zk .gm-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 14px 14px 12px; text-align: left; border-radius: 22px; }
.zk .gm-row .grow { flex: 1; min-width: 0; }
.zk .gm-row b { display: block; font-weight: 600; font-size: 15.5px; }
.zk .gm-row small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }
.zk .gm-row .chev { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
  transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
.zk .gm-it.open .chev { transform: rotate(90deg); }
/* раскрытие формы: 0fr → 1fr, плавно и без расчёта высоты */
.zk .gm-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.3,1.1,.4,1); }
.zk .gm-body > div { overflow: hidden; min-height: 0; padding: 0 14px; }
.zk .gm-it.open .gm-body { grid-template-rows: 1fr; }
.zk .gm-it.open .gm-body > div { padding-bottom: 14px; }
.zk .gm-body .req { background: transparent; border: 0; padding: 0; }
.zk .gm-empty { padding: 18px 6px; text-align: center; }
@media (max-width: 520px) { .zk .gm-wrap { padding: 12px; } .zk .gm-in { padding: 14px 14px 6px; } .zk .gm-list { margin: 0 -14px; padding: 2px 14px 12px; } .zk .gm-h h2 { font-size: 19px; } }

/* ===== Уведомления: «Мессенджер · Новости», список чатов + открытый чат ===== */
.zk .ms-seg { max-width: 620px; border-radius: 999px; padding: 5px; }
.zk .ms-seg button { height: 42px; border-radius: 999px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.zk .ms-badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--h2); color: #fff; font-variant-numeric: tabular-nums; flex: none; }
[data-scheme="dark"] .zk .ms-badge { color: var(--h6); }
.zk .ms { display: grid; gap: 16px; }
@media (min-width: 760px) { .zk .ms { grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); height: max(460px, calc(100dvh - 236px)); } }
.zk .ms-list { display: grid; gap: 10px; align-content: start; padding: 10px; border-radius: 30px; background: var(--surface-2); border: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain;
  -webkit-backdrop-filter: blur(calc(20px * var(--gk))) saturate(160%); backdrop-filter: blur(calc(20px * var(--gk))) saturate(160%); }
.zk .ms-it { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px 10px 10px; border-radius: 999px; text-align: left; background: var(--surface); box-shadow: var(--shadow);
  transition: transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .2s, background .2s; }
.zk .ms-it:active { transform: scale(.97); }
.zk .ms-it.on { box-shadow: inset 0 0 0 1.5px var(--h3), 0 10px 24px -14px rgba(var(--sh),.45); background: rgba(var(--wf),.85); }
.zk .ms-it .avatar, .zk .ms-h .avatar { width: 46px; height: 46px; font-size: 15px; }
.zk .avatar.grp { background: var(--h1); color: #fff; }
[data-scheme="dark"] .zk .avatar.grp { color: var(--h6); }
.zk .ms-txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.zk .ms-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.zk .ms-top b { flex: 1; min-width: 0; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zk .ms-top time { font-size: 12px; color: var(--muted); flex: none; }
.zk .ms-top small { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zk .ms-chat { display: flex; flex-direction: column; min-height: 0; border-radius: 30px; padding: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(calc(20px * var(--gk))) saturate(160%); backdrop-filter: blur(calc(20px * var(--gk))) saturate(160%); }
.zk .ms-h { display: flex; align-items: center; gap: 10px; }
.zk .ms-name { flex: 1; min-width: 0; display: grid; padding: 8px 18px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }

'use strict';

/* ---------- Внешний вид: тема, сила стекла, часы, док, доступность. Хранится только в этом браузере ---------- */

// Фоны: [id, название, оттенок фона, голубые шары, белые шары]. Оттенок же подмешивается в стекло, если включена подстройка
const BGS = [['spheres', 'Сферы', '159,192,227', '110,158,204', '159,192,227'], ['dawn', 'Рассвет', '238,176,168', '236,150,140', '232,186,214'],

const spring = (x, eps = .001) => ({ x, t: x, v: 0, eps });
function stepSpring(s, k, c, m, dt) {
  s.v += ((-k * (s.x - s.t) - c * s.v) / m) * dt;

}
